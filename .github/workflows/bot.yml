name: Run Bale Bot

on:
  workflow_dispatch:

jobs:
  bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Prepare project structure
        run: |
          mkdir -p core
          cp bale_api.py core/bale_api.py
          cp storage.py core/storage.py
          touch core/__init__.py

      - name: Check project
        run: |
          echo "=== Project files ==="
          ls -la
          echo "=== Core files ==="
          ls -la core

      - name: Start Bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
          python bot.py
